<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#123F36" />
    <title>ZYLO App — Coming Soon</title>
    <link rel="canonical" href="https://zyloo.co.in/app/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --forest: #123f36;
        --accent: #c49a45;
        --cream: #f6f3ee;
        --muted: #5a6e68;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Source Sans 3", system-ui, sans-serif;
        color: #0e1f1b;
        background:
          radial-gradient(900px 500px at 10% 0%, rgba(42, 107, 92, 0.2), transparent 55%),
          linear-gradient(180deg, var(--cream), #e7efe9);
        padding: 2rem;
      }
      main {
        max-width: 520px;
        text-align: center;
      }
      .brand {
        font-family: Outfit, sans-serif;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: var(--forest);
        font-size: 1.4rem;
      }
      .brand span { color: var(--accent); }
      h1 {
        font-family: Outfit, sans-serif;
        font-size: clamp(1.8rem, 5vw, 2.4rem);
        color: var(--forest);
        margin: 1rem 0 0.75rem;
      }
      p { color: var(--muted); line-height: 1.55; }
      a {
        display: inline-flex;
        margin-top: 1.25rem;
        padding: 0.85rem 1.3rem;
        border-radius: 999px;
        background: var(--forest);
        color: var(--cream);
        text-decoration: none;
        font-family: Outfit, sans-serif;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">ZYLO<span>.</span></div>
      <h1>Customer web portal coming soon</h1>
      <p>
        Booking, OTP sign-in, payments and profile management remain available in the
        ZYLO customer mobile app. This <code>/app</code> route is reserved for the
        future web customer experience and is not a live booking portal yet.
      </p>
      <a href="/">Back to zyloo.co.in</a>
    </main>
  </body>
</html>
